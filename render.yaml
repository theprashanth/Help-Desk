# Render blueprint for the server (Dashboard › New › Blueprint › pick this repo). See DEPLOY.md.
services:
  - type: web
    name: help-desk-api
    runtime: node
    rootDir: server
    # --include=dev: TypeScript is needed to build even though NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # paste your MongoDB Atlas connection string when asked
      - key: JWT_SECRET
        generateValue: true  # Render creates a long random secret
      - key: DASHBOARD_URL
        sync: false          # your dashboard's address, e.g. https://help.yourco.com
      - key: PUBLIC_API_URL
        sync: false          # this service's address, e.g. https://help-desk-api.onrender.com
